name: wordcard_app
description: "WORDCARD 单词机的手机端：按来源和批次录词库、排艾宾浩斯当天表、经 BLE 推词和发音到设备。Android only。"
publish_to: 'none'

# version 和 APK 文件名里的 v0.1.x 保持一致；改完 app 出包时两个一起进。
version: 0.2.0+20

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 停在 1.x：2.0 起换成了自定义 "FlutterBluePlus License"，商用要付费；
  # 1.36.8 还是 BSD-3 重分发授权，自用/分发给孩子家长都没门槛。API 我们要用到的部分两版一致。
  flutter_blue_plus: ^1.36.8
  # 13.x 的 android 子包把 compileSdk 钉在 37，本机 SDK 只有预览版 android-37.0，
  # Gradle 认不出 'android-37' 这个 target；11.4.0 用的是已经装好的 34。
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/words.tsv
